<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School Website</title><link rel="stylesheet" href="../assets/css/style.css"></head><body>
<header><div class="brand" id="brand">School Website</div><nav><a href="#about">About</a><a href="#team">Team</a><a href="https://portal.greatindia.technology/" target="_blank">Student Login</a></nav></header>
<section class="hero"><h1 id="title">Welcome</h1><p id="principal"></p></section><div class="wrap"><section class="card" id="about"><h2>About Us</h2><p id="aboutText">Loading...</p><p id="contact"></p></section><section class="card" id="team"><h2>Our Team</h2><div id="teamList" class="grid"></div></section></div>
<script type="module">import{supabase}from'../assets/js/supabase-config.js';const slug=new URLSearchParams(location.search).get('school');if(!slug){document.querySelector('#aboutText').textContent='School not selected.'}else{let{data:s,error}=await supabase.from('schools').select('*').eq('slug',slug).eq('is_public',true).maybeSingle();if(error||!s){document.querySelector('#aboutText').textContent='School not found or not public.'}else{brand.textContent=s.school_name;title.textContent='Welcome to '+s.school_name;principal.textContent=s.principal_name?'Principal / Director: '+s.principal_name:'';aboutText.textContent=s.about_school||'Welcome to our institute.';contact.textContent=[s.phone,s.email,s.address].filter(Boolean).join(' | ');let{data:t}=await supabase.from('team_members').select('*').eq('school_id',s.id);teamList.innerHTML=(t||[]).map(x=>`<div class="card">${x.photo_url?`<img src="${x.photo_url}" style="max-width:100%;height:140px;object-fit:cover;border-radius:8px">`:''}<h3>${x.name}</h3><b>${x.designation||''}</b><p>${x.description||''}</p></div>`).join('')||'Team information will appear here.'}}</script></body></html>
