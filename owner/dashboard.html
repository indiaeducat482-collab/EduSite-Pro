<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner Dashboard</title><link rel="stylesheet" href="../assets/css/style.css"></head><body>
<header><div class="brand">EduSite Pro Owner</div><nav><a href="school.html">School</a><a href="team.html">Team</a><a href="forms.html">Forms</a><a href="website.html">Public Website</a><a href="#" id="logout">Logout</a></nav></header>
<div class="wrap"><h1>Welcome, Owner</h1><div class="grid"><a class="card" href="school.html"><h2>🏫 School Details</h2><p>Add/Edit your institute information.</p></a><a class="card" href="team.html"><h2>👨‍🏫 Team Management</h2><p>Add and delete team members.</p></a><a class="card" href="forms.html"><h2>📝 Form Builder</h2><p>Create and delete forms.</p></a><a class="card" href="website.html"><h2>🌐 Public Website</h2><p>Publish and open your site.</p></a></div><p id="status" class="notice">Loading your account...</p></div>
<script type="module">import{requireUser,getMySchool,logout}from'../assets/js/common.js';document.querySelector('#logout').onclick=e=>{e.preventDefault();logout()};try{await requireUser();let s=await getMySchool();document.querySelector('#status').textContent=s?'Your school: '+s.school_name:'Please create your School Profile first.'}catch(e){document.querySelector('#status').textContent=e.message}</script></body></html>
