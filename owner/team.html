<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team</title><link rel="stylesheet" href="../assets/css/style.css"></head><body>
<header><div class="brand">👨‍🏫 Team Management</div><nav><a href="dashboard.html">Dashboard</a></nav></header><div class="wrap"><div class="card"><h2>Add Team Member</h2><form id="f"><input id="name" placeholder="Name" required><input id="designation" placeholder="Designation"><textarea id="description" placeholder="Description"></textarea><input id="photo_url" placeholder="Photo URL (Supabase Storage upload can be added next)"><button>Add Member</button></form><p id="msg"></p></div><div class="card"><h2>Your Team</h2><div id="list"></div></div></div>
<script type="module">import{getMySchool,requireUser}from'../assets/js/common.js';import{supabase}from'../assets/js/supabase-config.js';await requireUser();let s=await getMySchool();const list=document.querySelector('#list'),m=document.querySelector('#msg');async function load(){if(!s){list.innerHTML='Create School Profile first.';return}let{data,error}=await supabase.from('team_members').select('*').eq('school_id',s.id).order('created_at',{ascending:false});if(error){list.textContent=error.message;return}list.innerHTML=(data||[]).map(x=>`<div class="item"><b>${x.name}</b> — ${x.designation||''}<br><span class="muted">${x.description||''}</span><br><button class="danger" data-id="${x.id}">Delete</button></div>`).join('')||'No members yet.';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{await supabase.from('team_members').delete().eq('id',b.dataset.id);load()})}await load();document.querySelector('#f').onsubmit=async e=>{e.preventDefault();if(!s){m.textContent='Create School Profile first.';return}let r=await supabase.from('team_members').insert({school_id:s.id,name:name.value,designation:designation.value,description:description.value,photo_url:photo_url.value});m.textContent=r.error?r.error.message:'Team member added';if(!r.error){e.target.reset();load()}}</script></body></html>
