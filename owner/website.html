<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Public Website</title><link rel="stylesheet" href="../assets/css/style.css"></head><body>
<header><div class="brand">🌐 Public Website</div><nav><a href="dashboard.html">Dashboard</a></nav></header><div class="wrap"><div class="card"><h1>Publish Your Website</h1><p>Your school must be saved and marked public.</p><button id="publish">Publish / Update Public Website</button><p id="msg"></p><div id="link"></div><hr><h3>Student Login</h3><a class="btn" href="https://portal.greatindia.technology/" target="_blank">Great India Student Portal</a></div></div>
<script type="module">import{getMySchool,requireUser}from'../assets/js/common.js';import{supabase}from'../assets/js/supabase-config.js';await requireUser();let s=await getMySchool(),m=document.querySelector('#msg'),link=document.querySelector('#link');if(s){let u='../public/school.html?school='+encodeURIComponent(s.slug);link.innerHTML=`<p>Your public website:</p><a class="btn" href="${u}" target="_blank">Open Public Website</a>`}document.querySelector('#publish').onclick=async()=>{if(!s){m.textContent='Create School Profile first.';return}let r=await supabase.from('schools').update({is_public:true,status:'active'}).eq('id',s.id);m.textContent=r.error?r.error.message:'Website published successfully';m.className='notice ok'}</script></body></html>
