<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forms</title><link rel="stylesheet" href="../assets/css/style.css"></head><body>
<header><div class="brand">📝 Form Builder</div><nav><a href="dashboard.html">Dashboard</a></nav></header><div class="wrap"><div class="card"><h2>Create Form</h2><form id="f"><input id="title" placeholder="Form Title" required><input id="slug" placeholder="Form URL name" required><textarea id="description" placeholder="Description"></textarea><button>Create Form</button></form><p id="msg"></p></div><div class="card"><h2>Your Forms</h2><div id="list"></div></div></div>
<script type="module">import{getMySchool,requireUser}from'../assets/js/common.js';import{supabase}from'../assets/js/supabase-config.js';await requireUser();let s=await getMySchool(),list=document.querySelector('#list'),m=document.querySelector('#msg');async function load(){if(!s){list.innerHTML='Create School Profile first.';return}let{data,error}=await supabase.from('forms').select('*').eq('school_id',s.id);if(error){list.textContent=error.message;return}list.innerHTML=(data||[]).map(x=>`<div class="item"><b>${x.title}</b><br><span class="muted">${x.slug}</span><br><button class="danger" data-id="${x.id}">Delete</button></div>`).join('')||'No forms yet.';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{await supabase.from('forms').delete().eq('id',b.dataset.id);load()})}await load();document.querySelector('#f').onsubmit=async e=>{e.preventDefault();if(!s){m.textContent='Create School Profile first.';return}let r=await supabase.from('forms').insert({school_id:s.id,title:title.value,slug:slug.value,description:description.value,is_active:true});m.textContent=r.error?r.error.message:'Form created';if(!r.error){e.target.reset();load()}}</script></body></html>
