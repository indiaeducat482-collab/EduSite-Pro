<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School Profile</title><link rel="stylesheet" href="../assets/css/style.css"></head><body>
<header><div class="brand">🏫 School Profile</div><nav><a href="dashboard.html">Dashboard</a></nav></header><div class="wrap"><div class="card"><h1>Create / Edit Institute</h1><form id="f"><input id="school_name" placeholder="School / Institute Name" required><input id="slug" placeholder="Public URL name e.g. kartar-classes" required><input id="principal_name" placeholder="Principal / Director Name"><input id="phone" placeholder="Phone"><input id="email" type="email" placeholder="Email"><textarea id="address" placeholder="Address"></textarea><textarea id="about_school" placeholder="About School"></textarea><label><input id="is_public" type="checkbox" style="width:auto"> Make public</label><br><button>Save School Details</button></form><p id="msg"></p></div></div>
<script type="module">import{requireUser,getMySchool}from'../assets/js/common.js';import{supabase}from'../assets/js/supabase-config.js';const u=await requireUser(),f=document.querySelector('#f'),m=document.querySelector('#msg');let s=await getMySchool();if(s){['school_name','slug','principal_name','phone','email','address','about_school'].forEach(k=>document.querySelector('#'+k).value=s[k]||'');is_public.checked=!!s.is_public}f.onsubmit=async e=>{e.preventDefault();let x={owner_id:u.id,school_name:school_name.value,slug:slug.value.trim().toLowerCase().replace(/[^a-z0-9-]/g,'-'),principal_name:principal_name.value,phone:phone.value,email:email.value,address:address.value,about_school:about_school.value,is_public:is_public.checked,status:'active'};let r=s?await supabase.from('schools').update(x).eq('id',s.id):await supabase.from('schools').insert(x);if(r.error){m.textContent=r.error.message}else{m.textContent='Saved successfully';m.className='notice ok';s=await getMySchool()}}</script></body></html>
