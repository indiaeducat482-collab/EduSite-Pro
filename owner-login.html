<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner Login</title><link rel="stylesheet" href="assets/css/style.css"></head><body>
<div class="wrap"><div class="card" style="max-width:520px;margin:50px auto"><h1>Owner Login</h1><form id="f"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button>Login</button></form><p id="msg"></p></div></div>
<script type="module">import{supabase}from'./assets/js/supabase-config.js';const f=document.querySelector('#f'),m=document.querySelector('#msg');f.onsubmit=async e=>{e.preventDefault();let r=await supabase.auth.signInWithPassword({email:email.value,password:password.value});if(r.error){m.textContent=r.error.message;return}location.href='owner/dashboard.html'}</script></body></html>
