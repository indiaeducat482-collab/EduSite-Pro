<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register</title><link rel="stylesheet" href="assets/css/style.css"></head><body>
<div class="wrap"><div class="card" style="max-width:520px;margin:40px auto"><h1>Owner Registration</h1><form id="f"><input id="name" placeholder="Full Name" required><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password (minimum 6 characters)" required><button>Create Account</button></form><p id="msg"></p></div></div>
<script type="module">import{supabase}from'./assets/js/supabase-config.js';const f=document.querySelector('#f'),m=document.querySelector('#msg');f.onsubmit=async e=>{e.preventDefault();let r=await supabase.auth.signUp({email:email.value,password:password.value,options:{data:{full_name:name.value}}});m.textContent=r.error?r.error.message:'Account created successfully. You can now login.'}</script></body></html>
